name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: 单元测试
        run: pnpm test
      - name: 类型检查
        run: pnpm typecheck
      - name: 构建组件库
        run: pnpm build
      - name: 构建文档站
        run: pnpm docs:build
